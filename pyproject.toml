[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhub"
version = "0.1.0"
description = "Perfiles por aplicación y configuración de periféricos Logitech en Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PyQt6", "evdev"]

[project.scripts]
zhub = "zhub.gui:main"

[tool.setuptools]
packages = ["zhub"]
